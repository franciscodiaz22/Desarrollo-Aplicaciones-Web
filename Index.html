  <section class="contenido-principal">
  <section class="formulario"id="registro">
    <h2>Formulario de Registro de Datos</h2>
    <p>Complete los siguientes campos para registrar una nueva informacion.</p>

<form action="#"method="post">
<label for="nombre">Nombre completo</label>
<input type="text"id="nombre"name="nombre"placeholder="ingrese su nombre"required/>

 <label for="correo">Correo electrónico</label>
 <input type="email" id="correo"name="correo"placeholder="ejemplo@correo.com"requires/>
  
 <label for="telefono">Teléfono</label>
 <input type="tel"id="telefono"name="telefono"placeholder="809-000-0000"required/>

  <label for="departamento">Departamento</label>
  <select id="departamento"name="departamento"required>
  <option value="">Seleccione una opcion</option>
  <opcion value="administracion">Administración</opcion>
  <opcion value="ventas">Ventas</opcion>
  <opcion value="soporte">Soporte Técnico</opcion>
  <opcion value="tecnologia">Tecnología</opcion>
  </select>

  <label for="comentario">Comentario</label>
  <textarea id="comentario"name="comentario"rows="4"
  placeholder="Escriba una observación"></textarea>

  <button type="submit">Registrar Datos</button>
</form>
  </section>
